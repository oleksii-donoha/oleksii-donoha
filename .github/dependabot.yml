version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/' # Location of package.json
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      # The package declares engines.node >= 24, so its types must describe that
      # runtime. @types/node 26 would typecheck against APIs Node 24 does not
      # have. Drop this entry when engines.node moves to 26.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint peer-requires typescript < 6.1.0, so TypeScript 7 (the
      # native port) cannot be installed next to the linter. Drop this entry
      # once typescript-eslint supports TypeScript 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
